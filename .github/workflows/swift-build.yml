name: "[Swift] Build"

on: [push]

jobs:
  swift-cq:
    name: "Swift Build [${{ matrix.os }}]"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: yretenai/setup-swift@unsafe
        with:
          swift-version: "6.0.3"
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            swift build -c release
          else
            swift build -c release --static-swift-stdlib
          fi
      - name: Stage
        shell: bash
        run: |
          mkdir release
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp -rT "${LOCALAPPDATA}/Programs/Swift/Runtimes/6.0.3/usr/bin/" release 
            cp .build/release/Prismatic.exe release
          else
            cp .build/release/Prismatic release
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Prismatic-${{ matrix.os }}
          path: release
